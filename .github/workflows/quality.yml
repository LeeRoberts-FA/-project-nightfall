name: Nightfall Quality Gate
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check public/game.js
          if [ -f scripts/open-weights-agent.cjs ]; then node --check scripts/open-weights-agent.cjs; fi
          if [ -f scripts/huggingface-asset-scout.cjs ]; then node --check scripts/huggingface-asset-scout.cjs; fi
          node --input-type=module --check < public/scene3d.js
          for file in tests/*.test.js; do node --check "$file"; done
      - name: Game and network integration tests
        run: npm test
      - name: HTTP health and website smoke test
        run: |
          PORT=30281 npm start > /tmp/nightfall-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for x in {1..50}; do
            curl --fail --silent http://127.0.0.1:30281/health > /tmp/nightfall-health.json && break
            sleep 0.2
          done
          node -e "const x=require('/tmp/nightfall-health.json'); if(!x.ok)process.exit(1)"
          curl --fail --silent http://127.0.0.1:30281/ | grep -q 'PROJECT NIGHTFALL'
          curl --fail --silent http://127.0.0.1:30281/game.js | grep -q 'WebSocket'
          curl --fail --silent http://127.0.0.1:30281/style.css | grep -q 'mode-selection'
          curl --fail --silent http://127.0.0.1:30281/scene3d.js | grep -q 'NightfallScene'
          curl --fail --silent http://127.0.0.1:30281/three.module.js | grep -q 'WebGLRenderer'
          test $(wc -c < public/models/soldier.glb) -eq 3094592
          curl --fail --silent http://127.0.0.1:30281/models/soldier.glb | wc -c | grep -q '3094592'
      - name: Install headless Chromium gameplay tester
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Simulate iPhone outbreak gameplay and capture actual render
        run: |
          PORT=30281 npm start > /tmp/nightfall-browser-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          node tests/browser-smoke.cjs
      - name: Detect whether this commit changes the deployable game
        id: release_scope
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          files="$(git diff --name-only HEAD^ HEAD || true)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(server\.js|render\.yaml|package\.json|package-lock\.json|public/|scripts/install-assets\.cjs)'; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            echo "Production release check required for game changes."
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
            echo "Docs, workflow, or agent configuration only: skip Render commit matching."
          fi
      - name: Verify deployed public game after release
        if: github.ref == 'refs/heads/main' && steps.release_scope.outputs.release_required == 'true'
        env:
          NIGHTFALL_URL: https://project-nightfall-lee.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          mv test-results local-test-results
          node - <<'NODE'
          const url=process.env.NIGHTFALL_URL,expected=process.env.EXPECTED_COMMIT;
          (async()=>{
            for(let n=0;n<100;n++){
              try { const response=await fetch(url+'/health',{signal:AbortSignal.timeout(10000)});const health=await response.json();
                if(health.ok && health.commit===expected){console.log('Public release confirmed:',health.version,health.commit);return}
              } catch(e) { console.log('Waiting for public service:',e.message) }
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw Error('The expected release did not become live');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node tests/browser-smoke.cjs
      - name: Publish screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-iphone-gameplay
          path: |
            test-results/
            local-test-results/
          if-no-files-found: ignore
